name: ACME TLS Cert (DNS-01 via DuckDNS)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "certs/**"
      - ".github/workflows/acme-cert.yml"

permissions:
  contents: write

concurrency:
  group: acme-cert
  cancel-in-progress: true

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 2026-11-21: 根因修复。LE 限制同一域名每 168h(7天)最多签发 5 张
      # "重复证书"(new-certificates-per-exact-set-of-identifiers), 而 runner
      # 无状态导致每次定时任务都真实签发, 5 张配额 1~2 天就被烧光, 之后
      # 全部 429 秒挂。改为: repo 里现有证书剩余 > 60 天时直接跳过签发,
      # 只在到期前 30 天内才真正续签 => 每 7 天最多消耗 1 张配额, 永远够用。
      - name: Skip signing if existing cert is still fresh
        id: freshness
        run: |
          END=$(openssl x509 -in certs/fullchain.pem -noout -enddate | cut -d= -f2)
          REMAIN=$(( ( $(date -d "$END" +%s) - $(date +%s) ) / 86400 ))
          echo "现有证书到期: $END (剩余 ${REMAIN} 天)"
          if [ "$REMAIN" -gt 60 ]; then
            echo "::notice::证书剩余 ${REMAIN} 天, 无需续签 -- 跳过签发, 节省 LE 每周 5 张的重复证书配额"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 2026-11-21: 签发前先真实调用 DuckDNS API, 失败时给出明确错误
      # (token 失效/被限流/域名被禁), 不再让 acme.sh 深处报模糊错。
      - name: Preflight DuckDNS API (diagnose before signing)
        if: steps.freshness.outputs.skip != 'true'
        env:
          DuckDNS_Token: ${{ secrets.DD_TOKEN }}
        run: |
          [ -n "$DuckDNS_Token" ] || { echo "::error::缺少 DD_TOKEN Secret"; exit 1; }
          R=$(curl -s -m 20 "https://www.duckdns.org/update?domains=suzimo&token=$DuckDNS_Token&txt=diag-$(date +%s)" || true)
          echo "DuckDNS 预检响应: ${R:-<空>}"
          if [ "$R" != "OK" ]; then
            echo "::error::DuckDNS API 预检失败(响应=${R:-空}) -- token 失效、域名被禁用或限流, 签发必然失败"
            exit 1
          fi
          echo "DuckDNS API 预检通过, 开始签发"

      - name: Sign CSR (renews only when due)
        if: steps.freshness.outputs.skip != 'true'
        env:
          DuckDNS_Token: ${{ secrets.DD_TOKEN }}
        run: |
          "$HOME/.acme.sh/acme.sh" --issue --sign-csr --csr certs/suzimo.csr --dns dns_duckdns --server letsencrypt || {
            echo "::error::acme.sh 签发失败 -- 请查看上方完整输出(重点看 Register account / add TXT 响应与 LE 错误)"
            exit 1
          }
          CERTDIR=$(ls -d "$HOME"/.acme.sh/suzimo.duckdns.org* | head -1)
          cp "$CERTDIR/fullchain.cer" certs/fullchain.pem
          openssl x509 -in certs/fullchain.pem -noout -subject -enddate

      - name: Commit certificate if changed
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "acme-bot"
          git config user.email "acme-bot@users.noreply.github.com"
          git add -f certs/fullchain.pem
          if git diff --cached --quiet; then
            echo "Certificate unchanged, skip commit"
            exit 0
          fi
          git commit -m "Renew TLS cert for suzimo.duckdns.org $(date -u +%FT%TZ)"
          git push
