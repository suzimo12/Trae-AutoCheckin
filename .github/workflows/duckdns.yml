name: DuckDNS AAAA Sync

# 每 10 分钟从香橙派(经 Tailscale Funnel 的 ops_agent)读取「浮动服务地址」,
# 与 DuckDNS 记录比对,不一致才推送。
# 重要(2026-11-22 起):地址来源是浮动服务地址 dead:beef:cafe:1,不读具体网卡。
# 该地址有线在线时挂 end0、拔线后 3 秒内漂到 wlan0(见手册 13.15),
# 所以这里必须全接口搜索,否则每 10 分钟会把记录覆盖回接口地址,导致拔线后域名指飞。
# 安全设计:
#   1. token 全部存 GitHub Secrets,仓库内无明文
#   2. 取地址失败/格式异常 -> 直接跳过,绝不推送(防止把域名指飞)
#   3. 只接受 2xxx 开头的全局单播地址

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: duckdns-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPS_URL: https://orange-pi-relay.tail3f21d1.ts.net:8443/exec
      OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
      DD_TOKEN: ${{ secrets.DD_TOKEN }}
      DD_DOMAIN: suzimo

    steps:
      - name: 检查 token 配置
        run: |
          [ -n "$OPS_TOKEN" ] || { echo "::error::缺少 OPS_TOKEN Secret"; exit 1; }
          [ -n "$DD_TOKEN" ] || { echo "::error::缺少 DD_TOKEN Secret"; exit 1; }

      - name: 从板子读取当前 IPv6 地址
        id: addr
        run: |
          CMD="ip -6 addr show | grep 'dead:beef:cafe' | head -1 | awk '{print \$2}' | cut -d/ -f1"
          RESP=$(curl -sk -m 30 "$OPS_URL" -H "X-Auth-Token: $OPS_TOKEN" -H 'Content-Type: application/json' -d "$(python3 -c 'import json,sys; print(json.dumps({"cmd": sys.argv[1]}))' "$CMD")")
          echo "raw: $RESP"
          ADDR=$(printf '%s' "$RESP" | python3 -c "import sys,json,re; d=json.load(sys.stdin); out=(d.get('output','') or '') if d.get('ok') else ''; m=re.search(r'\b(2[0-9a-f]{0,3}(?::[0-9a-f]{1,4}){2,7})\b', out, re.I); print(m.group(1) if m else '')" 2>/dev/null || true)
          echo "parsed: [$ADDR]"
          if [ -z "$ADDR" ]; then
            echo "::warning::未能从板子取得有效 IPv6,本次跳过(不推送,防止指错)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "addr=$ADDR" >> "$GITHUB_OUTPUT"
          fi

      - name: 比对并推送 DuckDNS
        if: steps.addr.outputs.ok == 'true'
        run: |
          ADDR="${{ steps.addr.outputs.addr }}"
          # 二次校验:地址必须非空且是 2xxx 公网 v6,否则绝不推送
          if ! printf '%s' "$ADDR" | grep -qE '^2[0-9a-f:]+$'; then
            echo "::error::地址校验失败($ADDR),终止推送"
            exit 1
          fi
          CURRENT=$(python3 -c "import socket; print(socket.getaddrinfo('$DD_DOMAIN.duckdns.org',0,socket.AF_INET6)[0][4][0])" 2>/dev/null || true)
          echo "DNS 当前: [$CURRENT]"
          echo "板子当前: [$ADDR]"
          if [ "$CURRENT" = "$ADDR" ]; then
            echo "一致,无需推送"
            exit 0
          fi
          R=$(curl -fsS -m 20 "https://www.duckdns.org/update?domains=$DD_DOMAIN&token=$DD_TOKEN&ipv6=$ADDR")
          echo "DuckDNS 返回: $R"
          case "$R" in
            OK*) echo "推送成功" ;;
            *) echo "::error::DuckDNS 推送失败: $R"; exit 1 ;;
          esac
